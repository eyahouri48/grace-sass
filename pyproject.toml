[project]
name = "grace-sass"
version = "0.1.0"
description = "Suivi et prévision du stockage des eaux souterraines du SASS à partir de GRACE/GRACE-FO (proxy GLDAS) — OSS, programme Veille et Perspectives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Ingestion / données
    "xarray",
    "netcdf4",
    "pydap",              # OPeNDAP pour GLDAS (spec §4b)
    "rioxarray",          # découpage AOI (clip polygone)
    "geopandas",
    "shapely",            # opérations géométriques (explicite > transitive)
    "requests",
    "earthaccess",        # raccourci sanctionné pour l'auth EDL (spec §4)
    "pandas",
    "numpy",
    "pyarrow",            # Parquet
    # Analyse
    "statsmodels",        # SARIMAX + erreurs HAC + STL
    "pymannkendall",      # MK saisonnier / Hamed-Rao (spec §6.1)
    "prophet",            # prévision (spec §7.1)
    "pyproj",             # surface géodésique du polygone (spec §6.1)
    # Visualisation
    "plotly",
    "dash",               # développement local + Path B éventuel
    "kaleido>=1.3.0",     # export PNG (optionnel)
    "jinja2>=3.1.6",      # rendu template HTML statique (Path A)
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
